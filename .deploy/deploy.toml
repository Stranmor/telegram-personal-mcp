schema_version = 2
project_id = "telegram-personal-mcp-release"
default_target = "github-release"
release_id_template = "telegram-personal-mcp-{source_commit}-r{revision}"

[source]
kind = "git_head"
worktree = "exclude_uncommitted"

[targets.github-release]
continuity = "independent"
coordination_resources = ["repository:github.com/Stranmor/telegram-personal-mcp"]

[targets.github-release.vars]
remote = "origin"
repository = "Stranmor/telegram-personal-mcp"
workflow = "release.yml"
branch = "main"

[preflight]
argv = [
  "./.deploy/release-adapter.sh", "preflight",
  "--commit", "{source_commit}",
  "--release-id", "{release_id}",
  "--remote", "{remote}",
  "--repository", "{repository}",
  "--workflow", "{workflow}",
  "--branch", "{branch}",
]

[build]
argv = [
  "./.deploy/release-adapter.sh", "build",
  "--commit", "{source_commit}",
  "--release-id", "{release_id}",
  "--output", "{artifact_dir}/{release_id}.json",
]
capture = [
  { name = "manifest", kind = "absolute_file", under = "{artifact_dir}" },
  { name = "manifest_sha256", kind = "sha256", file = "{manifest}" },
  { name = "tag", kind = "text" },
]

[verify]
argv = [
  "./.deploy/release-adapter.sh", "verify",
  "--commit", "{source_commit}",
  "--release-id", "{release_id}",
  "--manifest", "{manifest}",
  "--manifest-sha256", "{manifest_sha256}",
  "--tag", "{tag}",
  "--remote", "{remote}",
  "--repository", "{repository}",
  "--workflow", "{workflow}",
  "--branch", "{branch}",
]

[apply]
argv = [
  "./.deploy/release-adapter.sh", "apply",
  "--commit", "{source_commit}",
  "--release-id", "{release_id}",
  "--transaction-id", "{transaction_id}",
  "--manifest", "{manifest}",
  "--manifest-sha256", "{manifest_sha256}",
  "--tag", "{tag}",
  "--remote", "{remote}",
  "--repository", "{repository}",
  "--workflow", "{workflow}",
  "--branch", "{branch}",
]
resume = "same_command"
success = "applied_and_verified"

[recovery]
mode = "apply_owned"
