version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      rmcp-sdk:
        patterns:
          - rmcp
          - rmcp-macros
      cargo-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - ferogram
          - rmcp
          - rmcp-macros
        update-types:
          - minor
          - patch
    ignore:
      # These are deliberate compatibility migrations, not unattended bumps.
      - dependency-name: ferogram
        versions:
          - ">= 0.6.3"
      - dependency-name: rmcp
        versions:
          - ">= 1.8.0"
      - dependency-name: rmcp-macros
        versions:
          - ">= 1.8.0"
      - dependency-name: sha2
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
