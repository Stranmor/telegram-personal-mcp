[workspace]
resolver = "2"
members = ["."]
exclude = ["vendor/ferogram", "vendor/ferogram-mtsender"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Stranmor"]
repository = "https://github.com/Stranmor/telegram-personal-mcp"

[package]
name = "telegram-personal-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A bounded Model Context Protocol server for Telegram personal accounts"
readme = "README.md"
keywords = ["telegram", "mcp", "mtproto", "ferogram", "automation"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
hermes-tdata = { path = "../hermes-smm-closure.3tN3xA/crates/hermes-tdata" }
# Keep the Telegram client on the latest stable compatible release; auth and
# message-page migrations are covered by the real backend and login tests.
ferogram = { version = "=0.6.4", features = ["html", "serde"] }
mp4 = "=0.14.0"
rmcp = { version = "=1.7.0", features = ["transport-io"] }
# rmcp 1.7.0 and its generated tool code must stay in lockstep. Newer macros
# reference SDK helpers that do not exist in this pinned protocol generation.
rmcp-macros = "=1.7.0"
rpassword = "7"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "socks", "multipart"] }
regex = "1"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "fs", "sync", "process", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
rmcp = { version = "=1.7.0", features = ["client", "transport-child-process"] }
tempfile = "3"

[patch.crates-io]
# telegram-personal-mcp is a request/response control surface, not a realtime
# update consumer. The narrow local Ferogram patch lets such consumers disable
# background update-gap tracking while retaining RPC updates returned directly
# by write calls. This avoids schema-churn loops in an otherwise idle MCP.
ferogram = { path = "vendor/ferogram" }
ferogram-mtsender = { path = "vendor/ferogram-mtsender" }
