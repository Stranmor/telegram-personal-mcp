[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Stranmor"]
repository = "https://github.com/Stranmor/telegram-personal-mcp"

[package]
name = "telegram-personal-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A bounded Model Context Protocol server for Telegram personal accounts"
readme = "README.md"
keywords = ["telegram", "mcp", "mtproto", "ferogram", "automation"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
ferogram = { version = "0.6.2", features = ["html", "serde"] }
rmcp = { version = "=2.2.0", features = ["transport-io"] }
# rmcp 1.7.0 and its generated tool code must stay in lockstep. Newer macros
# reference SDK helpers that do not exist in this pinned protocol generation.
rmcp-macros = "=2.2.0"
rpassword = "7"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "fs", "sync", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
rmcp = { version = "=2.2.0", features = ["client", "transport-child-process"] }
tempfile = "3"
